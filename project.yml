name: Hikari
options:
  bundleIdPrefix: com.hodadako
  deploymentTarget:
    macOS: "15.0"
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    CURRENT_PROJECT_VERSION: 15
    MARKETING_VERSION: 0.3.5
targets:
  HikariCore:
    type: framework.static
    platform: macOS
    sources:
      - Sources/HikariCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.HikariCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
  HikariNativeLock:
    type: framework.static
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Sources/HikariNativeLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.HikariNativeLock
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
  HikariNativeTool:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Sources/HikariNativeTool
    dependencies:
      - target: HikariNativeLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.Hikari.NativeTool
        PRODUCT_NAME: hikari-native-tool
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SKIP_INSTALL: YES
  Hikari:
    type: application
    platform: macOS
    productName: Hikari
    deploymentTarget: "15.0"
    sources:
      - path: Sources/HikariApp
        excludes:
          - LockShortcutController.swift
          - ScreenSaverInstaller.swift
      - path: Resources/Assets.xcassets
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/ko.lproj
        buildPhase: resources
    info:
      path: Resources/Hikari-Info.plist
      properties:
        CFBundleDisplayName: Hikari
        CFBundleName: Hikari
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 Hikari contributors
    dependencies:
      - target: HikariCore
      - target: HikariNativeLock
      - target: HikariNativeTool
        embed: false
    postBuildScripts:
      - name: Embed Hikari Native Tool
        script: |
          set -euo pipefail
          destination="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/MacOS"
          mkdir -p "${destination}"
          ditto "${BUILT_PRODUCTS_DIR}/hikari-native-tool" \
            "${destination}/hikari-native-tool"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.Hikari.NativeLocal
        PRODUCT_NAME: Hikari
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MACOSX_DEPLOYMENT_TARGET: "15.0"
  HikariCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/HikariCoreTests
    dependencies:
      - target: HikariCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.HikariCoreTests
  HikariNativeLockTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/HikariNativeLockTests
    dependencies:
      - target: HikariNativeLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.HikariNativeLockTests
  HikariWallpaperTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/HikariWallpaperTests
      - Sources/HikariApp/WallpaperController.swift
    dependencies:
      - target: HikariCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hodadako.HikariWallpaperTests
schemes:
  Hikari:
    build:
      targets:
        Hikari: all
        HikariNativeTool: all
        HikariCoreTests: [test]
        HikariNativeLockTests: [test]
        HikariWallpaperTests: [test]
    test:
      targets:
        - HikariCoreTests
        - HikariNativeLockTests
        - HikariWallpaperTests
      gatherCoverageData: true
